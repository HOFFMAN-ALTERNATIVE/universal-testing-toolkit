name: update-visual-baselines
# Re-records visual baselines inside the same Playwright container CI uses,
# so screenshots are pixel-identical between record and compare.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npx playwright test --project=visual --update-snapshots
        env: { HOME: /root }
      - name: Commit baselines
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual/__screenshots__
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "test(visual): update baselines [skip ci]"
          git push
