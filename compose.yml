# docker compose up --build --abort-on-container-exit
services:
  demo-app:
    build: ./demo-app
    ports: ["3000:3000"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      retries: 10
  runner:
    build: .
    depends_on:
      demo-app: { condition: service_healthy }
    environment:
      BASE_URL: http://demo-app:3000
    volumes:
      - ./reports:/suite/reports
    command: ["ci-fast"]
