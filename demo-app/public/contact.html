<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact · Acme Demo</title>
  <meta name="description" content="Acme Demo — a sample target application for the universal testing toolkit.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header>
    <a class="brand" href="/">Acme Demo</a>
    <nav aria-label="Main"><ul><li><a href="/">Home</a></li><li><a href="/products">Products</a></li><li><a href="/about">About</a></li><li><a href="/contact">Contact</a></li></ul></nav>
  </header>
  <main id="main">
    <h1>Contact us</h1>
    <!--STATUS-->
    <form method="post" action="/contact" novalidate>
      <label>Name <input name="name" autocomplete="name" required minlength="2"></label>
      <label>Email <input name="email" type="email" autocomplete="email" required></label>
      <label>Message <textarea name="message" rows="5" required minlength="10"></textarea></label>
      <button class="btn" type="submit">Send message</button>
    </form>
  </main>
  <footer><p>© 2026 Acme Demo · <a href="/about">About</a> · <a href="/contact">Contact</a></p></footer>
</body>
</html>
